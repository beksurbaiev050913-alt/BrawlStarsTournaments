<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Vegas_Kazik</title>

<style>
*{box-sizing:border-box;font-family:Segoe UI,sans-serif}

body{
  margin:0;
  background:radial-gradient(circle at top,#2a0040,#000);
  color:#fff;
}

/* Шапка */
header{
  text-align:center;
  padding:20px;
  font-size:30px;
  font-weight:900;
  color:#ff4dff;
  text-shadow:0 0 15px #ff4dff;
}

#balance{text-align:center;font-size:20px;margin-bottom:10px}

/* Меню */
nav{
  display:flex;
  justify-content:center;
  gap:15px;
  background:#140020;
  padding:10px;
}
nav button{
  border:2px solid #00f7ff;
  background:none;
  color:#fff;
  padding:10px 18px;
  border-radius:25px;
  cursor:pointer;
}

/* Кейсы (как музей) */
.cases{
  display:flex;
  gap:25px;
  justify-content:center;
  flex-wrap:wrap;
  padding:20px;
}
.case{
  width:220px;
  padding:20px;
  border-radius:25px;
  text-align:center;
  opacity:0.4;
}
.case .emoji{font-size:42px}

.bronze{background:linear-gradient(145deg,#8b5a2b,#c68642)}
.silverCase{background:linear-gradient(145deg,#9aa7b2,#4facfe)}
.gold{background:linear-gradient(145deg,#ffd700,#ff9900);color:#000}
.spring{background:linear-gradient(145deg,#2ecc71,#a3ffcb);color:#000}

/* 🔥 ГЛАВНАЯ НАДПИСЬ */
.pause{
  text-align:center;
  margin:30px;
  font-size:26px;
  font-weight:bold;
  color:red;
  animation:blink 1.2s infinite;
  text-shadow:0 0 10px red, 0 0 25px red;
}

@keyframes blink{
  0%{opacity:1}
  50%{opacity:0.2}
  100%{opacity:1}
}

/* затемнение */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  pointer-events:none;
}
</style>
</head>

<body>

<header>Бека депает — и ты депай!</header>

<div id="balance">
Баланс: <span>—</span> CC
</div>

<nav>
  <button>Кейсы</button>
  <button>Мои герои</button>
  <button>Black Pass</button>
</nav>

<!-- 🔥 НАДПИСЬ -->
<div class="pause">
Игра идет на долгий тех.перерыв...<br>
Мы готовим глобальное обновление 🔥
</div>

<!-- Кейсы (просто как память) -->
<div class="cases">
  <div class="case bronze">
    <div class="emoji">📦</div>
    <h3>Новичок</h3>
  </div>

  <div class="case silverCase">
    <div class="emoji">🧊</div>
    <h3>Стандарт</h3>
  </div>

  <div class="case gold">
    <div class="emoji">💎</div>
    <h3>Дубай</h3>
  </div>

  <div class="case spring">
    <div class="emoji">🌸</div>
    <h3>Весенний</h3>
  </div>
</div>

<div class="overlay"></div>

</body>
</html>
