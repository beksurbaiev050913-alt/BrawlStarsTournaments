<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Plus</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: radial-gradient(circle at top, #1f2b6d 0%, #0b1026 35%, #02030a 100%);
      height: 100vh;
      color: white;
      position: relative;
    }

    /* Звезды */
    .stars, .stars2, .stars3 {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-repeat: repeat;
      pointer-events: none;
    }

    .stars {
      background-image:
        radial-gradient(2px 2px at 20px 30px, white, transparent),
        radial-gradient(1.5px 1.5px at 100px 120px, #cfd8ff, transparent),
        radial-gradient(2px 2px at 200px 80px, white, transparent),
        radial-gradient(1.5px 1.5px at 300px 200px, #ffffff, transparent),
        radial-gradient(2px 2px at 400px 150px, #dbe6ff, transparent),
        radial-gradient(1.5px 1.5px at 550px 90px, white, transparent),
        radial-gradient(2px 2px at 700px 250px, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 900px 100px, #dbe6ff, transparent);
      background-size: 1000px 400px;
      animation: moveStars 80s linear infinite;
      opacity: 0.9;
    }

    .stars2 {
      background-image:
        radial-gradient(1.5px 1.5px at 50px 50px, white, transparent),
        radial-gradient(2px 2px at 180px 170px, #dbe6ff, transparent),
        radial-gradient(1.5px 1.5px at 350px 60px, white, transparent),
        radial-gradient(2px 2px at 500px 220px, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 700px 130px, #cfd8ff, transparent),
        radial-gradient(2px 2px at 850px 280px, white, transparent);
      background-size: 1100px 450px;
      animation: moveStars 120s linear infinite reverse;
      opacity: 0.65;
    }

    .stars3 {
      background-image:
        radial-gradient(2px 2px at 120px 70px, white, transparent),
        radial-gradient(1.5px 1.5px at 280px 140px, #dbe6ff, transparent),
        radial-gradient(2px 2px at 460px 40px, white, transparent),
        radial-gradient(1.5px 1.5px at 680px 180px, #ffffff, transparent),
        radial-gradient(2px 2px at 920px 90px, #cfd8ff, transparent);
      background-size: 1200px 500px;
      animation: moveStars 160s linear infinite;
      opacity: 0.45;
    }

    @keyframes moveStars {
      from { transform: translateY(0); }
      to { transform: translateY(-400px); }
    }

    .container {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 64px;
      letter-spacing: 3px;
      margin-bottom: 30px;
      text-shadow: 0 0 15px rgba(255,255,255,0.35);
    }

    .create-btn {
      padding: 16px 34px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #4f7cff, #7d5cff);
      box-shadow: 0 10px 30px rgba(90, 120, 255, 0.35);
      transition: 0.25s;
    }

    .create-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 35px rgba(90, 120, 255, 0.5);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      color: #222;
      border-radius: 22px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      animation: popup 0.25s ease;
    }

    @keyframes popup {
      from {
        transform: scale(0.9);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal h2 {
      font-size: 28px;
      margin-bottom: 14px;
      color: #2a2a2a;
    }

    .modal p {
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 24px;
      color: #444;
    }

    .close-btn {
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #ff5b5b, #ff7b7b);
      transition: 0.2s;
    }

    .close-btn:hover {
      transform: scale(1.05);
    }

    .planet {
      position: absolute;
      right: -80px;
      top: 80px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #6fa8ff, #2f4b9a 60%, #18244f 100%);
      box-shadow: 0 0 60px rgba(95, 140, 255, 0.25);
      opacity: 0.8;
      z-index: 1;
    }

    .planet::after {
      content: "";
      position: absolute;
      left: -30px;
      top: 105px;
      width: 320px;
      height: 40px;
      border: 5px solid rgba(210, 220, 255, 0.5);
      border-radius: 50%;
      transform: rotate(-12deg);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 42px;
      }

      .create-btn {
        font-size: 18px;
        padding: 14px 24px;
      }

      .modal h2 {
        font-size: 24px;
      }

      .modal p {
        font-size: 16px;
      }

      .planet {
        width: 170px;
        height: 170px;
        right: -50px;
        top: 60px;
      }

      .planet::after {
        width: 210px;
        left: -20px;
        top: 65px;
      }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>
  <div class="planet"></div>

  <div class="container">
    <h1>Air Plus</h1>
    <button class="create-btn" onclick="openModal()">Создать игру</button>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>Ой!</h2>
      <p>
        Приложение Family Link мешает нашему приложению.
        Удалите его для продолжения.
      </p>
      <button class="close-btn" onclick="closeModal()">Закрыть</button>
    </div>
  </div>

  <script>
    const modal = document.getElementById("modal");

    function openModal() {
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    modal.addEventListener("click", function(e) {
      if (e.target === modal) {
        closeModal();
      }
    });
  </script>
</body>
</html>
