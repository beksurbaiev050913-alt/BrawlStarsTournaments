<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>JDM Машинка</title>
<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    margin: auto;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function drawCar(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // ТЕНЬ
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.beginPath();
  ctx.ellipse(120, 90, 100, 20, 0, 0, Math.PI * 2);
  ctx.fill();

  // КУЗОВ (основа)
  const grad = ctx.createLinearGradient(0, 0, 240, 0);
  grad.addColorStop(0, "#0d47a1");
  grad.addColorStop(1, "#42a5f5");

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(20, 80);
  ctx.lineTo(40, 50);
  ctx.lineTo(140, 50);
  ctx.lineTo(200, 70);
  ctx.lineTo(230, 80);
  ctx.lineTo(230, 95);
  ctx.lineTo(20, 95);
  ctx.closePath();
  ctx.fill();

  // КРЫША
  ctx.fillStyle = "#64b5f6";
  ctx.beginPath();
  ctx.moveTo(70, 50);
  ctx.lineTo(100, 20);
  ctx.lineTo(150, 20);
  ctx.lineTo(190, 50);
  ctx.closePath();
  ctx.fill();

  // ОКНА
  ctx.fillStyle = "#b3e5fc";
  ctx.beginPath();
  ctx.moveTo(105, 25);
  ctx.lineTo(145, 25);
  ctx.lineTo(175, 48);
  ctx.lineTo(100, 48);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(75, 48);
  ctx.lineTo(100, 25);
  ctx.lineTo(105, 25);
  ctx.lineTo(100, 48);
  ctx.closePath();
  ctx.fill();

  // СПОЙЛЕР (JDM стиль 😏)
  ctx.fillStyle = "#222";
  ctx.fillRect(210, 45, 20, 6);

  // ФАРА
  ctx.fillStyle = "#fff176";
  ctx.fillRect(220, 70, 10, 10);

  // ЗАДНИЙ ФОНАРЬ
  ctx.fillStyle = "#ff5252";
  ctx.fillRect(20, 70, 8, 10);

  // ОБВОДКА
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.stroke();

  // КОЛЁСА
  drawWheel(70, 100);
  drawWheel(170, 100);

  ctx.restore();
}

function drawWheel(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // резина
  ctx.beginPath();
  ctx.arc(0, 0, 25, 0, Math.PI * 2);
  ctx.fillStyle = "#111";
  ctx.fill();

  // диск
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fillStyle = "#ccc";
  ctx.fill();

  // спицы
  ctx.strokeStyle = "#666";
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * 14, Math.sin(a) * 14);
    ctx.stroke();
  }

  ctx.restore();
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // центр экрана
  drawCar(canvas.width / 2 - 120, canvas.height / 2 - 60);

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
