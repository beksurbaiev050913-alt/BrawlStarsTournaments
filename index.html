<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>💀 Копилка легенды</title>

<style>
body {
  font-family: Arial;
  color: white;
  text-align: center;
  padding: 40px;
  background: linear-gradient(-45deg,#0f172a,#1e293b,#020617,#111827);
  background-size: 400% 400%;
  animation: bg 10s ease infinite;
}

@keyframes bg {
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

.card {
  background: rgba(30,41,59,0.9);
  padding: 25px;
  border-radius: 20px;
  max-width: 400px;
  margin: auto;
}

/* 🏺 БАНКА */
.jar {
  width: 120px;
  height: 200px;
  border: 4px solid white;
  border-radius: 20px;
  margin: 20px auto;
  position: relative;
  overflow: hidden;
}

.fill {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 0%;
  background: #22c55e;
  transition: 0.5s;
}

/* 💀 POPUP */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
}

.popup-box {
  background: #1e293b;
  padding: 25px;
  border-radius: 15px;
}

button {
  margin: 10px;
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.ok { background: #22c55e; }
.sus { background: #facc15; }

</style>
</head>

<body>

<div class="card">
  <h1>📱 КОПИЛКА ЛЕГЕНДЫ</h1>
  <h2 id="money">0 сом</h2>
  <p>🎯 20000 сом</p>

  <!-- 🏺 БАНКА -->
  <div class="jar">
    <div class="fill" id="fill"></div>
  </div>

  <input type="number" id="input" placeholder="+ сом">
  <br><br>
  <button onclick="add()">💰 Закинуть</button>

  <p id="status">💬 Начни копить, не позорься 😄</p>
</div>

<!-- 💀 POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <p>💀 Э, я вижу что ты зажал деньги!  
    А НУ ЛОЖИ ВСЁ! Айфон ждёт ептваю!</p>

    <button class="ok" onclick="answer1()">Ладно ладно</button>
    <button class="sus" onclick="answer2()">Мамой клянусь, всё закинул</button>
  </div>
</div>

<script>
let goal = 20000;
let money = localStorage.getItem("money") || 0;

function update(){
  document.getElementById("money").innerText = money + " сом";

  let percent = (money / goal) * 100;
  document.getElementById("fill").style.height = percent + "%";
}

function add(){
  let val = document.getElementById("input").value;
  if(val){
    money = parseInt(money) + parseInt(val);
    localStorage.setItem("money", money);
    update();
    document.getElementById("popup").style.display = "flex";
  }
}

function answer1(){
  document.getElementById("status").innerText = "😏 Вот так то лучше";
  document.getElementById("popup").style.display = "none";
}

function answer2(){
  document.getElementById("status").innerText = "🤨 Нуу, ладно. Свободен!";
  document.getElementById("popup").style.display = "none";
}

update();
</script>

</body>
</html>
