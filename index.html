<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проект закрыт</title>
    <style>
        /* Убираем отступы и задаем черный фон */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000; /* Глубокий черный цвет */
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* Мрачный "компьютерный" шрифт */
        }

        /* Настройка текста */
        .status-message {
            color: #ff0000; /* Ярко-красный цвет */
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7), 0 0 20px rgba(255, 0, 0, 0.5);
            
            /* Применяем анимацию мигания */
            animation: blink 1.5s infinite ease-in-out;
            user-select: none;
        }

        /* Анимация мигания (плавное затухание и свечение) */
        @keyframes blink {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 40px rgba(255, 0, 0, 0.6);
            }
            50% {
                opacity: 0.1;
                text-shadow: none;
            }
        }

        /* Дополнительный эффект помех (опционально) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <div class="status-message">
        Проект закрыт<br>
        <span style="font-size: 2rem;">Игра окончена</span>
    </div>

</body>
</html>
